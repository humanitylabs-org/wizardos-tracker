<!doctype html>
<html lang="en" data-app="board">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Wizard OS Tracker</title>
  <script src="boot.js"></script>
  <link rel="stylesheet" href="wizard-tokens.css">
  <link rel="stylesheet" href="wizard-ui.css">
  <link rel="stylesheet" href="standalone.css">
  <link rel="stylesheet" href="styles.css">
  <script defer src="/wizard-os-home/core/app-client.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <div class="wz-app bd-app">
    <main class="wz-scroll bd-scroll" id="scroll">
      <!-- Not signed in: one card, one field. -->
      <section id="signin" class="wz-card bd-signin" hidden>
        <h1 class="bd-h1">Sign in with GitHub</h1>
        <form id="connect-form" class="bd-form" autocomplete="off">
          <input id="token" class="wz-input" type="password" autocomplete="new-password" spellcheck="false" autocapitalize="none" minlength="20" maxlength="400" required placeholder="Paste your GitHub token" aria-label="Your GitHub token">
          <button class="wz-button" type="submit" id="connect">Sign in</button>
        </form>
        <p class="bd-meta"><a class="bd-link" href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer">Make a token ↗</a> · the team org, all repos, Issues read and write.</p>
      </section>

      <div id="board" class="bd-board" hidden>
        <div class="bd-switch" role="tablist" aria-label="Show">
          <button type="button" role="tab" data-view="goals" aria-selected="true">Goals</button>
          <button type="button" role="tab" data-view="bugs" aria-selected="false">Bugs</button>
        </div>

        <section class="bd-sec" id="sec-test" hidden>
          <h2 class="bd-sec-h">Ready to test <span class="bd-n" id="n-test"></span></h2>
          <div class="bd-list" id="list-test"></div>
        </section>

        <section class="bd-sec" id="sec-doing">
          <h2 class="bd-sec-h">In progress <span class="bd-n" id="n-doing"></span></h2>
          <div class="bd-list rows" id="list-doing"></div>
          <p class="bd-empty" id="empty" hidden></p>
        </section>
      </div>
      <p id="loading" class="bd-empty">Loading…</p>
    </main>
    <p id="status" class="wz-status" role="status" aria-live="polite"></p>
  </div>
</body>
</html>
