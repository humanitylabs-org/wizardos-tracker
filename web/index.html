<!doctype html>
<html lang="en" data-app="board">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Wizard OS Tracker</title>
  <script src="boot.js"></script>
  <link rel="stylesheet" href="wizard-tokens.css">
  <link rel="stylesheet" href="wizard-ui.css">
  <link rel="stylesheet" href="standalone.css">
  <link rel="stylesheet" href="styles.css">
  <script defer src="/wizard-os-home/core/app-client.js"></script>
  <script defer src="wizard-sheet.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <div class="wz-app bd-app">
    <main class="wz-scroll bd-scroll" id="scroll">
      <!-- Not signed in: one card, one field. -->
      <section id="signin" class="wz-card bd-signin" hidden>
        <h1 class="bd-h1">Sign in with GitHub</h1>
        <form id="connect-form" class="bd-form" autocomplete="off">
          <input id="token" class="wz-input" type="password" autocomplete="new-password" spellcheck="false" autocapitalize="none" minlength="20" maxlength="400" required placeholder="Paste your GitHub token" aria-label="Your GitHub token">
          <button class="wz-button" type="submit" id="connect">Sign in</button>
        </form>
        <p class="bd-meta"><a class="bd-link" href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer">Make a token ↗</a> · the team org, all repos, Issues read and write.</p>
      </section>

      <div id="board" class="bd-board" hidden>
        <div class="bd-switch" role="tablist" aria-label="Show">
          <button type="button" role="tab" data-view="goals" aria-selected="true">Goals</button>
          <button type="button" role="tab" data-view="bugs" aria-selected="false">Bugs</button>
        </div>

        <!-- Builder switch, compact. -->
        <div class="bd-ctl">
          <button type="button" class="bd-toggle" id="builder" role="switch" aria-checked="false" aria-describedby="builder-state">
            <span class="bd-track" aria-hidden="true"><i></i></span>
            <span class="bd-ctl-name">Wizard OS Builder</span>
            <span class="bd-ctl-state" id="builder-state">Paused</span>
          </button>
          <p class="bd-ctl-note" id="builder-note" hidden>Not connected to the builder yet</p>
        </div>

        <!-- The workflow, three hand-off steps: Open → Build → Review, then Done. Tap a step for who does it. -->
        <div class="bd-flow" id="flow" role="group" aria-label="How work moves">
          <ol class="bd-steps" id="steps"></ol>
          <p class="bd-loop" id="loop"><span class="bd-loop-t">Doesn’t work → back to Build</span></p>
          <p class="bd-works" id="works"></p>
          <p class="bd-done" id="done"></p>
        </div>
        <dl class="bd-stats" id="stats" aria-label="Where work waits"></dl>

        <div class="bd-sub">
          <label class="bd-who" id="who-wrap" hidden><span class="wz-sr">Written by</span><select id="who"><option value="">Everyone</option></select></label>
          <button type="button" class="bd-pick" id="repo-btn" aria-haspopup="dialog" hidden>All repos</button>
          <p class="bd-totals" id="totals" aria-live="polite"></p>
        </div>

        <section class="bd-sec" id="sec-test" hidden>
          <h2 class="bd-sec-h">Waiting for review <span class="bd-n" id="n-test"></span></h2>
          <div class="bd-list" id="list-test"></div>
        </section>
        <section class="bd-sec" id="sec-building" hidden>
          <h2 class="bd-sec-h">Building <span class="bd-n" id="n-building"></span></h2>
          <div class="bd-list rows" id="list-building"></div>
        </section>
        <section class="bd-sec" id="sec-queued" hidden>
          <h2 class="bd-sec-h">Queued <span class="bd-n" id="n-queued"></span></h2>
          <div class="bd-list rows" id="list-queued"></div>
        </section>
        <p class="bd-empty" id="empty" hidden></p>
      </div>
      <p id="loading" class="bd-empty">Loading…</p>
    </main>
    <p id="status" class="wz-status" role="status" aria-live="polite"></p>
    <!-- Repo filter: pick one or several repos (only repos with items in this view). -->
    <dialog id="repos" class="wz-sheet bd-repos" aria-labelledby="r-title">
      <h2 id="r-title">Repos</h2>
      <div class="bd-r-list" id="r-list"></div>
      <div class="bd-btns"><button type="button" class="wz-button secondary" id="r-all">All repos</button><button type="button" class="wz-button" id="r-done">Done</button></div>
    </dialog>
    <!-- One step of the workflow: who does it and what it means. -->
    <dialog id="step" class="wz-sheet bd-stepsheet" aria-labelledby="s-title">
      <h2 id="s-title"></h2>
      <p id="s-about" class="bd-s-about"></p>
      <h3 class="bd-sec-h bd-s-h" id="s-who-h">Who</h3>
      <ul id="s-who" class="bd-s-who"></ul>
      <p id="s-except" class="bd-meta" hidden></p>
      <p id="s-next" class="bd-s-next"></p>
    </dialog>
    <!-- The one pop-up: the issue in full. Bottom sheet on phones, side panel on wide screens. -->
    <dialog id="detail" class="wz-sheet bd-detail" aria-labelledby="d-title">
      <h2 id="d-title" class="bd-d-title"></h2>
      <p id="d-meta" class="bd-meta"></p>
      <p id="d-labels" class="bd-meta bd-labels"></p>
      <p id="d-roles" class="bd-d-roles" hidden></p>
      <div id="d-body" class="bd-d-body"></div>
      <h3 id="d-comments-h" class="bd-sec-h bd-d-h" hidden>Comments <span class="bd-n" id="d-n-comments"></span></h3>
      <ol id="d-comments" class="bd-comments"></ol>
      <p class="bd-d-foot"><a id="d-gh" class="bd-link" href="#" target="_blank" rel="noopener noreferrer">Open on GitHub ↗</a></p>
    </dialog>
  </div>
</body>
</html>
