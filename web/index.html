<!doctype html>
<html lang="en" data-app="wizardos-tracker">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>WizardOS Tracker</title>
  <script src="boot.js"></script>
  <link rel="stylesheet" href="wizard-tokens.css">
  <link rel="stylesheet" href="wizard-ui.css">
  <link rel="stylesheet" href="standalone.css">
  <link rel="stylesheet" href="styles.css">
  <script defer src="/wizard-os-home/core/app-client.js"></script>
  <script defer src="wizard-sheet.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <div class="wz-app bd-app">
    <main class="wz-scroll bd-scroll" id="scroll">
      <!-- 0.12.2: tiny account control, top right -->
      <p class="bd-acct" id="acct"><span class="bd-fresh" id="fresh" aria-live="polite"></span><button type="button" class="bd-reload" id="reload" aria-label="Refresh now" title="Refresh now" hidden><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4h-4"/></svg></button><span id="acct-name" hidden></span> <button type="button" class="bd-acct-act" id="acct-act">Sign in</button></p>
      <!-- Not signed in: one card, one field. -->
      <section id="signin" class="wz-card bd-signin" hidden>
        <h1 class="bd-h1">Sign in with GitHub</h1>
        <!-- 0.13: GitHub device flow when a client id is set (one button, then a code to type on GitHub). -->
        <div id="oauth" class="bd-oauth" hidden>
          <button class="wz-button" type="button" id="oauth-go">Sign in with GitHub</button>
          <div id="oauth-code" class="bd-oauth-code" hidden>
            <p class="bd-meta">Enter this code on GitHub:</p>
            <p class="bd-code"><b id="oauth-user-code" aria-live="polite"></b> <button type="button" class="wz-button secondary bd-copy" id="oauth-copy">Copy</button></p>
            <a class="wz-button bd-open-gh" id="oauth-open" href="https://github.com/login/device" target="_blank" rel="noopener noreferrer">Open GitHub ↗</a>
            <p class="bd-meta" id="oauth-wait">Waiting for GitHub…</p>
            <button type="button" class="bd-acct-act" id="oauth-cancel">Cancel</button>
          </div>
          <p class="bd-meta"><button type="button" class="bd-acct-act bd-use-token" id="oauth-token">Use a token instead</button></p>
        </div>
        <form id="connect-form" class="bd-form" autocomplete="off">
          <input id="token" class="wz-input" type="password" autocomplete="new-password" spellcheck="false" autocapitalize="none" minlength="20" maxlength="400" required placeholder="Paste your GitHub token" aria-label="Your GitHub token">
          <button class="wz-button" type="submit" id="connect">Sign in</button>
        </form>
        <p class="bd-meta" id="token-help"><a class="bd-link" href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer">Make a token ↗</a> · the team org, all repos, Issues read and write.</p>
      </section>

      <!-- 0.12: refused sign-in (not on the team, or an agent's account). Nothing was saved. -->
      <section id="refused" class="wz-card bd-signin" hidden>
        <h1 class="bd-h1" id="refused-title">For the WizardOS team</h1>
        <p class="bd-refused" id="refused-text"></p>
        <button class="wz-button secondary" type="button" id="refused-back">Use another account</button>
      </section>

      <div id="board" class="bd-board" hidden>
        <!-- Goals | Bugs and the small Builder switch, one row. -->
        <div class="bd-head">
          <div class="bd-switch" role="tablist" aria-label="Show">
            <button type="button" role="tab" data-view="goals" aria-selected="true">Goals</button>
            <button type="button" role="tab" data-view="features" aria-selected="false">Features</button>
            <button type="button" role="tab" data-view="bugs" aria-selected="false">Bugs</button>
          </div>
          <button type="button" class="bd-toggle" id="builder" role="switch" aria-checked="false" aria-label="Builder" aria-describedby="builder-state">
            <span class="bd-ctl-name" aria-hidden="true">Builder</span>
            <span class="bd-track" aria-hidden="true"><i></i></span>
            <span class="bd-ctl-state" id="builder-state">Paused</span>
          </button>
        </div>

        <!-- The assembly line (0.13): Queued → Building → AI review → Human review → Done, numbers first, each bin with
             its own tiny stat. Tap a bin to show only that stage; ⓘ says who does it. Two return arrows to Building
             (from AI review and from Human review) carry their kick-back rates. -->
        <div class="bd-flow" id="flow" role="group" aria-label="How work moves">
          <ol class="bd-steps" id="steps"></ol>
          <div class="bd-ctls" id="ctl" role="group" aria-label="Targets and who does each step"></div>
          <p class="bd-loop bd-loops" id="loop"><i class="bd-loop2" aria-hidden="true"></i><button type="button" class="bd-kick bd-kick-ai" id="kick-ai" aria-label="AI review fail goes back to Building" hidden></button><button type="button" class="bd-kick bd-kick-h" id="kick" aria-label="Doesn't work goes back to Building" hidden></button></p>
        </div>

        <!-- Bugs only: Who and Repo chip rows (multi-select, counts, All resets), and a tiny sort control. -->
        <div class="bd-filters" id="filters" hidden>
          <div class="bd-chips" id="c-who" role="group" aria-label="Who opened it"></div>
          <div class="bd-chips" id="c-repo" role="group" aria-label="Repo"></div>
        </div>
        <div class="bd-sub">
          <div class="bd-fs" id="f-stage" hidden><button type="button" class="bd-pick on bd-stagepick" aria-label="Show every stage"></button></div>
          <p class="bd-totals" id="totals" aria-live="polite"></p>
          <div class="bd-sort" id="sort" role="radiogroup" aria-label="Sort" hidden></div>
        </div>

        <section class="bd-sec" id="sec-test" hidden>
          <h2 class="bd-sec-h">Human review <span class="bd-n" id="n-test"></span></h2>
          <div class="bd-list" id="list-test"></div>
        </section>
        <section class="bd-sec" id="sec-airev" hidden>
          <h2 class="bd-sec-h">AI review <span class="bd-n" id="n-airev"></span></h2>
          <div class="bd-list rows" id="list-airev"></div>
        </section>
        <section class="bd-sec" id="sec-building" hidden>
          <h2 class="bd-sec-h">Building <span class="bd-n" id="n-building"></span></h2>
          <div class="bd-list rows" id="list-building"></div>
        </section>
        <section class="bd-sec" id="sec-queued" hidden>
          <h2 class="bd-sec-h">Queued <span class="bd-n" id="n-queued"></span></h2>
          <div class="bd-list rows" id="list-queued"></div>
        </section>
        <section class="bd-sec" id="sec-done" hidden>
          <h2 class="bd-sec-h">Done <span class="bd-n" id="n-done"></span></h2>
          <div class="bd-list rows" id="list-done"></div>
        </section>
        <p class="bd-empty" id="empty" hidden></p>
      </div>
      <p id="loading" class="bd-empty">Loading…</p>
    </main>
    <p id="status" class="wz-status" role="status" aria-live="polite"></p>
    <!-- Small anchored note (bins, Builder, Try it). -->
    <div id="pop" class="bd-pop" role="status" aria-live="polite" hidden></div>
    <!-- The one pop-up: the issue in full. Bottom sheet on phones, side panel on wide screens. -->
    <dialog id="detail" class="wz-sheet bd-detail" aria-labelledby="d-title">
      <h2 id="d-title" class="bd-d-title"></h2>
      <p id="d-meta" class="bd-meta"></p>
      <p id="d-labels" class="bd-meta bd-labels"></p>
      <p id="d-roles" class="bd-d-roles" hidden></p>
      <p id="d-onbox" class="bd-d-onbox" hidden></p>
      <p id="d-steps" class="bd-d-roles" hidden></p>
      <div id="d-flow" class="bd-d-flow"></div>
      <div id="d-body" class="bd-d-body"></div>
      <h3 id="d-comments-h" class="bd-sec-h bd-d-h" hidden>Comments <span class="bd-n" id="d-n-comments"></span></h3>
      <ol id="d-comments" class="bd-comments"></ol>
      <p class="bd-d-foot"><button type="button" class="wz-button secondary bd-d-close" id="d-close" hidden>Mark done</button> <a id="d-gh" class="bd-link" href="#" target="_blank" rel="noopener noreferrer">Open on GitHub ↗</a></p>
    </dialog>
  </div>
</body>
</html>
