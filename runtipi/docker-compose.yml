services:
  wizardos-tracker:
    image: python:3.12-alpine
    user: 1000:1000
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    mem_limit: 128m
    tmpfs:
    - /tmp
    environment:
      PORT: '8799'
      DATA_DIR: /data
      WIZARD_TRUSTED_HOSTS: ${WIZARD_TRUSTED_HOSTS:-}
      WIZARD_TRUSTED_ORIGINS: ${WIZARD_TRUSTED_ORIGINS:-}
    volumes:
    - ${APP_DATA_DIR}/data:/data
    read_only: true
    command:
    - python
    - -c
    - "import base64,json,pathlib,runpy,sys,zlib\nroot=pathlib.Path('/tmp/wizard-app');root.mkdir(exist_ok=True)\nfiles=json.loads(zlib.decompress(base64.b64decode(''.join(sys.argv[1:]))))\n\
      for name,text in files.items():\n p=root/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)\nrunpy.run_path(str(root/'app/server.py'),run_name='__main__')\n"
    - 
    - 
    x-runtipi:
      is_main: true
      internal_port: 8799
x-runtipi:
  schema_version: 2
  overrides: []
